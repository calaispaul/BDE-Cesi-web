<head>
<meta charset="UTF-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">

<title>Bientôt – BDE CESI Lille</title>
<meta name="description" content="La collection 2026-2027 du BDE CESI Lille arrive lundi 23 novembre à 8 h 30.">
<meta property="og:title" content="Bientôt – BDE CESI Lille">
<meta property="og:description" content="La collection 2026-2027 du BDE CESI Lille arrive lundi 23 novembre à 8 h 30.">
<meta property="og:image" content="images/og.jpg">
<link rel="icon" type="image/png" href="favicon.png">

</head><body class="attente">
<main class="wt" id="contenu">
  <img class="wt-logo" src="images/logo-noir.png" alt="BDE CESI Lille" width="192" height="192">

  <!-- le pull noir de dos, en mosaïque de pixels floutés qui s'affine jusqu'à l'ouverture -->
  <div class="wt-visual" aria-hidden="true"><canvas id="wtPixels" width="600" height="600"></canvas></div>

  <p class="wt-kicker">Collection 2026–2027</p>
  <h1 class="wt-title">Bientôt<span class="dot">.</span></h1>
  <p class="wt-lead">Ouverture le <b>lundi 23 novembre à 8 h 30</b>.</p>

  <div class="wt-count" role="timer" aria-live="off" aria-label="Temps restant avant l'ouverture">
    <div><b id="cdD">0</b><span>jours</span></div>
    <div><b id="cdH">00</b><span>heures</span></div>
    <div><b id="cdM">00</b><span>minutes</span></div>
    <div><b id="cdS">00</b><span>secondes</span></div>
  </div>

  <div class="wt-foot">
    <button type="button" class="wt-team" id="wtTeam" aria-expanded="false" aria-controls="wtForm">Accès équipe</button>
    <form class="wt-form" id="wtForm" hidden autocomplete="off" novalidate>
      <label class="sr" for="wtCode">Code d'accès</label>
      <input id="wtCode" name="code" type="password" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40" placeholder="Code d'accès" required>
      <button type="submit" class="pill blue" id="wtGo">Entrer</button>
      <p class="wt-msg" id="wtMsg" aria-live="polite"></p>
    </form>
    <p class="wt-links"><a href="infos-legales.html">Infos légales</a> · <a href="https://www.instagram.com/bde.cesi.lille/" target="_blank" rel="noopener noreferrer">@bde.cesi.lille</a></p>
  </div>
</main>
</body>
</html>
